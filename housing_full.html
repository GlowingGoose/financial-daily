<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>70城房价 — 完整版</title>
<style>
:root {
  --bg: #f7f4ef; --paper: #fff; --ink: #1a1714;
  --ink-mid: #5c5650; --ink-light: #9e9590; --rule: #d9d4cc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Georgia", serif; font-size: 14px;
  min-height: 100vh;
}

/* ── 顶栏 ── */
.topbar {
  background: var(--ink); color: #fff;
  padding: 18px 32px; display: flex;
  align-items: baseline; gap: 24px;
}
.topbar h1 { font-size: 20px; font-weight: normal; }
.topbar span { font-size: 12px; color: #aaa; font-style: italic; }

/* ── 视图切换 ── */
.view-tabs {
  display: flex; background: var(--paper);
  border-bottom: 1px solid var(--rule); padding: 0 32px;
}
.view-tab {
  background: none; border: none; border-bottom: 3px solid transparent;
  padding: 14px 24px; font-family: "Georgia", serif; font-size: 14px;
  color: var(--ink-mid); cursor: pointer;
}
.view-tab:hover { color: var(--ink); }
.view-tab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: bold; }

/* ── 控制栏 ── */
.controls {
  background: var(--paper); border-bottom: 1px solid var(--rule);
  padding: 14px 32px; display: flex; gap: 24px; align-items: center; flex-wrap: wrap;
}
.ctrl-label { font-size: 12px; color: var(--ink-mid); white-space: nowrap; }

.btn-group { display: flex; }
.btn-group button {
  font-family: "Georgia", serif; font-size: 13px;
  border: 1px solid var(--rule); background: var(--paper);
  color: var(--ink); padding: 6px 14px; cursor: pointer;
}
.btn-group button:not(:last-child) { border-right: none; }
.btn-group button:hover { background: #f0ece6; }
.btn-group button.active { background: var(--ink); color: #fff; }

select {
  font-family: "Georgia", serif; font-size: 13px;
  border: 1px solid var(--rule); background: var(--paper);
  color: var(--ink); padding: 6px 10px; cursor: pointer;
  min-width: 160px; max-width: 280px;
}

/* ── 视图容器 ── */
.view-pane { display: none; padding: 32px; }
.view-pane.active { display: block; }

.chart-card {
  background: var(--paper); border: 1px solid var(--rule);
  padding: 28px 32px; margin-bottom: 24px;
}
.chart-title {
  font-size: 13px; color: var(--ink-mid); margin-bottom: 16px;
  font-style: italic;
}
#chart-tier, #chart-city { width: 100%; }

/* ── 城市明细视图 — 下拉 + 对比 ── */
.city-row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }

/* ── 统计卡片 ── */
.stat-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 1px; background: var(--rule); border: 1px solid var(--rule);
  margin-bottom: 24px;
}
.stat-card {
  background: var(--paper); padding: 16px 20px;
}
.stat-label { font-size: 11px; color: var(--ink-mid); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 24px; margin-top: 4px; }
.stat-sub { font-size: 11px; color: var(--ink-light); margin-top: 2px; }

/* ── tooltip ── */
.d3-tip {
  position: absolute; background: var(--ink); color: #fff;
  padding: 8px 14px; font-size: 13px; border-radius: 4px;
  pointer-events: none; opacity: 0; transition: opacity 0.15s;
  white-space: nowrap; font-family: "Georgia", serif;
}

/* ── 底部 ── */
.footer {
  text-align: center; font-size: 12px; color: var(--ink-light);
  padding: 20px; font-style: italic;
}
</style>
</head>
<body>

<div class="topbar">
  <h1>70个大中城市房价数据</h1>
  <span>数据来源：国家统计局 &nbsp;|&nbsp; 城市等级视图 36个月 · 城市明细视图 11个月</span>
</div>

<!-- 视图切换 -->
<div class="view-tabs">
  <button class="view-tab active" onclick="switchView('tier')">📊 城市等级视图</button>
  <button class="view-tab" onclick="switchView('city')">🏙️ 城市明细视图</button>
</div>

<!-- ════════════════ 视图1: 城市等级 ════════════════ -->
<div id="pane-tier" class="view-pane active">
  <div class="controls">
    <span class="ctrl-label">指标：</span>
    <div class="btn-group" id="tier-indicators">
      <button class="active" data-ind="新房环比">新房环比</button>
      <button data-ind="新房同比">新房同比</button>
      <button data-ind="二手环比">二手环比</button>
      <button data-ind="二手同比">二手同比</button>
    </div>
    <span class="ctrl-label" style="margin-left:12px;">城市等级：</span>
    <div class="btn-group" id="tier-tiers">
      <button class="active" data-tier="一线城市">一线城市</button>
      <button class="active" data-tier="二线城市">二线城市</button>
      <button class="active" data-tier="三线城市">三线城市</button>
    </div>
    <span class="ctrl-label" style="margin-left:12px;">时间范围：</span>
    <div class="btn-group" id="tier-range">
      <button class="active" data-range="all">全部</button>
      <button data-range="2024">2024</button>
      <button data-range="2025">2025</button>
      <button data-range="2026">2026</button>
    </div>
  </div>

  <div class="stat-cards" id="tier-stats"></div>

  <div class="chart-card">
    <div class="chart-title" id="tier-chart-title">一线/二线/三线城市 新房环比 走势（2023.2 — 2026.7）</div>
    <svg id="chart-tier"></svg>
  </div>
</div>

<!-- ════════════════ 视图2: 城市明细 ════════════════ -->
<div id="pane-city" class="view-pane">
  <div class="controls">
    <span class="ctrl-label">指标：</span>
    <div class="btn-group" id="city-indicators">
      <button class="active" data-ind="新房环比">新房环比</button>
      <button data-ind="新房同比">新房同比</button>
      <button data-ind="二手环比">二手环比</button>
      <button data-ind="二手同比">二手同比</button>
    </div>
    <span class="ctrl-label">选择城市：</span>
    <select id="city-select">
      <option value="">— 选择一个城市 —</option>
    </select>
    <span class="ctrl-label">对比城市：</span>
    <select id="city-compare" multiple size="1" style="min-width:180px;height:36px;">
      <option value="">— 可多选对比 —</option>
    </select>
    <button onclick="resetCityView()" style="font-family:Georgia,serif;font-size:13px;border:1px solid var(--rule);background:var(--paper);padding:6px 14px;cursor:pointer;">重置</button>
  </div>

  <div class="stat-cards" id="city-stats"></div>

  <div class="chart-card">
    <div class="chart-title" id="city-chart-title">城市房价走势</div>
    <svg id="chart-city"></svg>
  </div>
</div>

<div class="footer">
  环比 = 与上月相比 &nbsp;|&nbsp; 同比 = 与去年同期相比 &nbsp;|&nbsp; 单位：%
</div>

<div class="d3-tip" id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

const TIER_MONTHS = FULL_DATA.tier_months;
const CITY_MONTHS = FULL_DATA.city_view.months;
const CITY_LIST = Object.keys(FULL_DATA.city_view.cities).sort();

const TIER_COLORS = {
  '一线城市': '#1a4f7a',
  '二线城市': '#1a6b3a',
  '三线城市': '#7a5c1a'
};

const IND_COLORS = ['#1a4f7a','#5a3470','#1a6b3a','#b5341a','#7a5c1a','#1a7a6b','#7a1a5c','#3a1a7a'];

// ── 状态 ──
let tierIndicator = '新房环比';
let tierActive = new Set(['一线城市','二线城市','三线城市']);
let tierRange = 'all';

let cityIndicator = '新房环比';
let citySelected = '';
let cityCompare = [];

// ════════════════════════════════════════════════
// 城市明细 — 填充下拉框
// ════════════════════════════════════════════════
(function initCityDropdown() {
  const sel = document.getElementById('city-select');
  const cmp = document.getElementById('city-compare');
  CITY_LIST.forEach(c => {
    sel.add(new Option(c, c));
    cmp.add(new Option(c, c));
  });
  sel.addEventListener('change', e => {
    citySelected = e.target.value;
    drawCityChart();
  });
  cmp.addEventListener('change', e => {
    cityCompare = Array.from(e.target.selectedOptions).map(o => o.value).filter(v => v);
    drawCityChart();
  });
})();

// ════════════════════════════════════════════════
// 视图切换
// ════════════════════════════════════════════════
function switchView(v) {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view-pane').forEach(p => p.classList.remove('active'));
  document.querySelector(`.view-tab[onclick="switchView('${v}')"]`).classList.add('active');
  document.getElementById('pane-' + v).classList.add('active');
  if (v === 'tier') drawTierChart();
  else drawCityChart();
}

// ════════════════════════════════════════════════
// 工具函数
// ════════════════════════════════════════════════
function rangeFilter(months, range) {
  if (range === 'all') return months;
  return months.filter(m => m.startsWith(range));
}

function getTierValues(tier, ind) {
  return FULL_DATA.tier_view[tier].map(d => ({ month: d.month, value: d[ind] }));
}

function getCityValues(city, ind) {
  const d = FULL_DATA.city_view.cities[city];
  if (!d) return [];
  return CITY_MONTHS.map((m, i) => ({
    month: m,
    value: (d.indicators[ind] || [])[i]
  })).map(p => ({ ...p, value: p.value === null || p.value === undefined || p.value === '—' ? null : parseFloat(p.value) }));
}

function calcStats(values) {
  const valid = values.filter(v => v !== null);
  if (!valid.length) return { latest: '—', avg: '—', max: '—', min: '—' };
  const latest = valid[valid.length - 1];
  const avg = valid.reduce((a, b) => a + b, 0) / valid.length;
  return {
    latest: (latest > 0 ? '+' : '') + latest.toFixed(2),
    avg: (avg > 0 ? '+' : '') + avg.toFixed(2),
    max: Math.max(...valid).toFixed(2),
    min: Math.min(...valid).toFixed(2)
  };
}

// ════════════════════════════════════════════════
// 绘图: 城市等级
// ════════════════════════════════════════════════
function drawTierChart() {
  const svg_el = document.getElementById('chart-tier');
  const W = svg_el.clientWidth || 1000;
  const H = 420;
  const margin = { top: 20, right: 80, bottom: 70, left: 60 };
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  // 过滤月份
  const filteredMonths = rangeFilter(TIER_MONTHS, tierRange);

  // 收集数据
  const series = [];
  tierActive.forEach(tier => {
    const raw = FULL_DATA.tier_view[tier];
    const points = filteredMonths
      .map(m => raw.find(d => d.month === m))
      .filter(Boolean)
      .map(d => ({ month: d.month, value: d[tierIndicator] }));
    if (points.length) series.push({ tier, points });
  });

  // 更新标题
  const tierNames = Array.from(tierActive).join(' / ');
  document.getElementById('tier-chart-title').textContent =
    `${tierNames} ${tierIndicator} 走势（${filteredMonths[0]} — ${filteredMonths[filteredMonths.length-1]}）`;

  // 更新统计卡片
  const statsEl = document.getElementById('tier-stats');
  statsEl.innerHTML = '';
  series.forEach(s => {
    const valid = s.points.filter(p => p.value !== null);
    const stats = calcStats(valid.map(p => p.value));
    const color = TIER_COLORS[s.tier];
    statsEl.innerHTML += `
      <div class="stat-card">
        <div class="stat-label" style="color:${color}">${s.tier} · ${tierIndicator}</div>
        <div class="stat-value" style="color:${color}">${stats.latest}<span style="font-size:14px">%</span></div>
        <div class="stat-sub">均值 ${stats.avg}% &nbsp;|&nbsp; 高 ${stats.max}% &nbsp; 低 ${stats.min}%</div>
      </div>`;
  });

  // D3 绘图
  d3.select(svg_el).selectAll('*').remove();
  if (!series.length) return;

  const svg = d3.select(svg_el).attr('viewBox', `0 0 ${W} ${H}`);
  const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

  // 收集所有值算 domain
  const allVals = series.flatMap(s => s.points.map(p => p.value)).filter(v => v !== null);
  const extent = d3.extent(allVals);
  const pad = (extent[1] - extent[0]) * 0.2 || 1;

  const xS = d3.scalePoint().domain(filteredMonths).range([0, w]).padding(0.05);
  const yS = d3.scaleLinear().domain([extent[0] - pad, extent[1] + pad]).range([h, 0]).nice();

  // 网格线
  g.append('g').selectAll('line.grid')
    .data(yS.ticks(6)).enter()
    .append('line').attr('class','grid')
    .attr('x1',0).attr('x2',w)
    .attr('y1',d=>yS(d)).attr('y2',d=>yS(d))
    .attr('stroke','#e8e4de').attr('stroke-width',1);

  // 零线
  if (extent[0] < 0 && extent[1] > 0) {
    g.append('line')
      .attr('x1',0).attr('x2',w)
      .attr('y1',yS(0)).attr('y2',yS(0))
      .attr('stroke','#9e9590').attr('stroke-width',1).attr('stroke-dasharray','4,3');
  }

  // 画线
  series.forEach((s, i) => {
    const color = TIER_COLORS[s.tier];
    const validPoints = s.points.filter(p => p.value !== null);

    g.append('path')
      .datum(validPoints)
      .attr('fill','none').attr('stroke',color).attr('stroke-width',2.5)
      .attr('d', d3.line()
        .x(d => xS(d.month)).y(d => yS(d.value))
        .curve(d3.curveMonotoneX)
      );

    // 末段标签
    const last = validPoints[validPoints.length - 1];
    if (last) {
      g.append('text')
        .attr('x', xS(last.month) + 6).attr('y', yS(last.value))
        .attr('dy','0.35em').attr('fill',color).attr('font-size','13px').attr('font-family','Georgia,serif')
        .text(s.tier);
    }

    // 数据点
    g.selectAll(`.dot-${i}`)
      .data(validPoints).enter()
      .append('circle').attr('class',`dot-${i}`)
      .attr('cx', d => xS(d.month)).attr('cy', d => yS(d.value))
      .attr('r', 4).attr('fill', color).attr('stroke','#fff').attr('stroke-width',1.5)
      .style('cursor','pointer')
      .on('mouseover', function(ev, d) {
        d3.select(this).attr('r', 6);
        showTip(ev, `${d.month}<br><b>${s.tier}</b><br>${fmt(d.value)}%`);
      })
      .on('mouseout', function() { d3.select(this).attr('r', 4); hideTip(); });
  });

  // Y轴
  g.append('g')
    .call(d3.axisLeft(yS).ticks(6).tickFormat(d => (d>0?'+':'')+d.toFixed(1)+'%'))
    .call(gg => gg.select('.domain').remove())
    .call(gg => gg.selectAll('.tick line').attr('stroke','#d9d4cc'))
    .call(gg => gg.selectAll('.tick text').attr('fill','#5c5650').attr('font-size','12px').attr('font-family','Georgia,serif'));

  // X轴（斜放标签）
  const tickCount = filteredMonths.length;
  const step = tickCount > 24 ? 3 : tickCount > 12 ? 2 : 1;
  const ticks = filteredMonths.filter((_, i) => i % step === 0);
  g.append('g').attr('transform',`translate(0,${h})`)
    .selectAll('text').data(ticks).enter()
    .append('text')
    .attr('x', d => xS(d)).attr('y', 0)
    .attr('fill','#5c5650').attr('font-size','11px').attr('font-family','Georgia,serif')
    .attr('transform','rotate(-35)').attr('text-anchor','end').attr('dx','-0.4em').attr('dy','0.8em')
    .text(d => d.replace('年','.'));
}

// ════════════════════════════════════════════════
// 绘图: 城市明细
// ════════════════════════════════════════════════
function drawCityChart() {
  const svg_el = document.getElementById('chart-city');
  const W = svg_el.clientWidth || 1000;
  const H = 420;
  const margin = { top: 20, right: 120, bottom: 70, left: 60 };
  const w = W - margin.left - margin.right;
  const h = H - margin.top - margin.bottom;

  const toShow = [];
  if (citySelected) toShow.push(citySelected);
  cityCompare.forEach(c => { if (c && !toShow.includes(c)) toShow.push(c); });

  if (!toShow.length) {
    d3.select(svg_el).selectAll('*').remove();
    const svg = d3.select(svg_el).attr('viewBox',`0 0 ${W} ${H}`);
    svg.append('text')
      .attr('x',w/2+margin.left).attr('y',h/2+margin.top)
      .attr('text-anchor','middle').attr('fill','#9e9590').attr('font-size','15px').attr('font-family','Georgia,serif')
      .text('请从上方选择一个城市查看走势');
    document.getElementById('city-stats').innerHTML = '';
    document.getElementById('city-chart-title').textContent = '城市房价走势';
    return;
  }

  const allVals = [];
  toShow.forEach(c => {
    getCityValues(c, cityIndicator).forEach(p => { if (p.value !== null) allVals.push(p.value); });
  });
  const extent = d3.extent(allVals);
  const pad = (extent[1] - extent[0]) * 0.2 || 1;

  const xS = d3.scalePoint().domain(CITY_MONTHS).range([0, w]).padding(0.05);
  const yS = d3.scaleLinear().domain([extent[0] - pad, extent[1] + pad]).range([h, 0]).nice();

  document.getElementById('city-chart-title').textContent =
    toShow.join(' / ') + ' · ' + cityIndicator + '（' + CITY_MONTHS[0] + ' — ' + CITY_MONTHS[CITY_MONTHS.length-1] + '）';

  // 统计卡片
  const statsEl = document.getElementById('city-stats');
  statsEl.innerHTML = '';
  toShow.forEach((c, i) => {
    const vals = getCityValues(c, cityIndicator).map(p => p.value).filter(v => v !== null);
    const stats = calcStats(vals);
    const color = IND_COLORS[i % IND_COLORS.length];
    statsEl.innerHTML += `
      <div class="stat-card">
        <div class="stat-label" style="color:${color}">${c}</div>
        <div class="stat-value" style="color:${color}">${stats.latest}<span style="font-size:14px">%</span></div>
        <div class="stat-sub">均值 ${stats.avg}% &nbsp;|&nbsp; 高 ${stats.max}% &nbsp; 低 ${stats.min}%</div>
      </div>`;
  });

  d3.select(svg_el).selectAll('*').remove();
  const svg = d3.select(svg_el).attr('viewBox',`0 0 ${W} ${H}`);
  const g = svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`);

  // 网格
  g.append('g').selectAll('line.grid')
    .data(yS.ticks(6)).enter().append('line').attr('class','grid')
    .attr('x1',0).attr('x2',w).attr('y1',d=>yS(d)).attr('y2',d=>yS(d))
    .attr('stroke','#e8e4de').attr('stroke-width',1);

  if (extent[0] < 0 && extent[1] > 0) {
    g.append('line').attr('x1',0).attr('x2',w).attr('y1',yS(0)).attr('y2',yS(0))
      .attr('stroke','#9e9590').attr('stroke-width',1).attr('stroke-dasharray','4,3');
  }

  toShow.forEach((city, i) => {
    const color = IND_COLORS[i % IND_COLORS.length];
    const points = getCityValues(city, cityIndicator).filter(p => p.value !== null);

    g.append('path')
      .datum(points)
      .attr('fill','none').attr('stroke',color).attr('stroke-width',2.5)
      .attr('d', d3.line().x(d=>xS(d.month)).y(d=>yS(d.value)).curve(d3.curveMonotoneX));

    const last = points[points.length-1];
    if (last) {
      g.append('text').attr('x',xS(last.month)+6).attr('y',yS(last.value))
        .attr('dy','0.35em').attr('fill',color).attr('font-size','13px').attr('font-family','Georgia,serif').text(city);
    }

    g.selectAll(`.cdot-${i}`).data(points).enter()
      .append('circle').attr('class',`cdot-${i}`)
      .attr('cx',d=>xS(d.month)).attr('cy',d=>yS(d.value))
      .attr('r',4).attr('fill',color).attr('stroke','#fff').attr('stroke-width',1.5)
      .style('cursor','pointer')
      .on('mouseover', function(ev,d) { d3.select(this).attr('r',6); showTip(ev, `${d.month}<br><b>${city}</b><br>${fmt(d.value)}%`); })
      .on('mouseout', function() { d3.select(this).attr('r',4); hideTip(); });
  });

  // 轴
  g.append('g').call(d3.axisLeft(yS).ticks(6).tickFormat(d=>(d>0?'+':'')+d.toFixed(1)+'%'))
    .call(gg=>gg.select('.domain').remove())
    .call(gg=>gg.selectAll('.tick line').attr('stroke','#d9d4cc'))
    .call(gg=>gg.selectAll('.tick text').attr('fill','#5c5650').attr('font-size','12px').attr('font-family','Georgia,serif'));

  const step = CITY_MONTHS.length > 14 ? 2 : 1;
  const ticks = CITY_MONTHS.filter((_,i)=>i%step===0);
  g.append('g').attr('transform',`translate(0,${h})`)
    .selectAll('text').data(ticks).enter().append('text')
    .attr('x',d=>xS(d)).attr('y',0)
    .attr('fill','#5c5650').attr('font-size','11px').attr('font-family','Georgia,serif')
    .attr('transform','rotate(-35)').attr('text-anchor','end').attr('dx','-0.4em').attr('dy','0.8em')
    .text(d=>d.replace('年','.'));
}

// ════════════════════════════════════════════════
// Tooltip
// ════════════════════════════════════════════════
function fmt(v) { return (v>0?'+':'')+parseFloat(v).toFixed(2); }
function showTip(ev, html) {
  const tip = document.getElementById('tip');
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = (ev.pageX + 14) + 'px';
  tip.style.top = (ev.pageY - 40) + 'px';
}
function hideTip() { document.getElementById('tip').style.opacity = 0; }

// ════════════════════════════════════════════════
// 指标切换绑定
// ════════════════════════════════════════════════
['tier', 'city'].forEach(prefix => {
  document.querySelectorAll(`#${prefix}-indicators button`).forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll(`#${prefix}-indicators button`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (prefix === 'tier') { tierIndicator = btn.dataset.ind; drawTierChart(); }
      else { cityIndicator = btn.dataset.ind; drawCityChart(); }
    });
  });
});

// 等级切换
document.querySelectorAll('#tier-tiers button').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('active')) {
      if (tierActive.size > 1) { tierActive.delete(btn.dataset.tier); btn.classList.remove('active'); }
    } else { tierActive.add(btn.dataset.tier); btn.classList.add('active'); }
    drawTierChart();
  });
});

// 时间范围切换
document.querySelectorAll('#tier-range button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#tier-range button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tierRange = btn.dataset.range;
    drawTierChart();
  });
});

function resetCityView() {
  document.getElementById('city-select').value = '';
  document.getElementById('city-compare').selectedIndex = -1;
  citySelected = ''; cityCompare = [];
  drawCityChart();
}

window.addEventListener('resize', () => {
  if (document.getElementById('pane-tier').classList.contains('active')) drawTierChart();
  else drawCityChart();
});

// 初始化
drawTierChart();
</script>
</body>
</html>
