<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据看板中心</title>
<style>
:root {
  --bg: #f7f4ef;
  --paper: #ffffff;
  --ink: #1a1714;
  --ink-mid: #5c5650;
  --ink-light: #9e9590;
  --rule: #d9d4cc;
  --sidebar-w: 260px;
  --accent: #e74c3c;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Georgia", serif;
  font-size: 14px;
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── 侧边栏 ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--ink);
  color: #fff;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-header {
  padding: 24px 20px 16px;
  border-bottom: 1px solid #333;
}
.sidebar-header h1 {
  font-size: 16px;
  font-weight: normal;
  color: #fff;
  line-height: 1.3;
}
.sidebar-header .subtitle {
  font-size: 11px;
  color: #888;
  margin-top: 4px;
  font-style: italic;
}

.sidebar-section {
  padding: 12px 0;
  border-bottom: 1px solid #2a2a2a;
}
.sidebar-section-label {
  font-size: 10px;
  letter-spacing: 1px;
  color: #555;
  padding: 0 20px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  transition: background 0.15s;
  border-left: 3px solid transparent;
  user-select: none;
}
.sidebar-item:hover {
  background: #2a2a2a;
}
.sidebar-item.active {
  background: #2a2a2a;
  border-left-color: var(--accent);
}
.sidebar-item .icon {
  font-size: 18px;
  flex-shrink: 0;
}
.sidebar-item .info {
  flex: 1;
  min-width: 0;
}
.sidebar-item .name {
  font-size: 13px;
  color: #ddd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-item .desc {
  font-size: 11px;
  color: #666;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 1px;
}
.sidebar-item .arrow {
  color: #444;
  font-size: 12px;
  flex-shrink: 0;
}
.sidebar-item.active .arrow { color: var(--accent); }

.sidebar-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid #2a2a2a;
  font-size: 11px;
  color: #555;
  font-style: italic;
}

/* ── 主内容区 ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.main-topbar {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.main-topbar .breadcrumb {
  font-size: 13px;
  color: var(--ink-mid);
}
.main-topbar .breadcrumb .current {
  color: var(--ink);
  font-weight: bold;
}
.main-topbar .actions {
  margin-left: auto;
  display: flex;
  gap: 10px;
}
.main-topbar button {
  font-family: "Georgia", serif;
  font-size: 12px;
  border: 1px solid var(--rule);
  background: var(--paper);
  color: var(--ink-mid);
  padding: 5px 12px;
  cursor: pointer;
  border-radius: 3px;
}
.main-topbar button:hover {
  background: var(--bg);
}

.main-iframe-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ── 空状态 ── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--ink-light);
  font-size: 15px;
  gap: 12px;
}
.empty-state .emoji { font-size: 48px; }
.empty-state .hint { font-size: 13px; }
</style>
</head>
<body>

<!-- ══════ 侧边栏 ══════ -->
<nav class="sidebar">
  <div class="sidebar-header">
    <h1>📊 数据看板中心</h1>
    <div class="subtitle">多看板统一入口</div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">看板列表</div>
    <div id="nav-list"></div>
  </div>

  <div class="sidebar-footer">
    由 OpenClaw 自动生成
  </div>
</nav>

<!-- ══════ 主内容 ══════ -->
<div class="main">
  <div class="main-topbar">
    <div class="breadcrumb">
      <span id="breadcrumb-home">数据看板中心</span>
      <span id="breadcrumb-sep" style="display:none"> &gt; </span>
      <span class="current" id="breadcrumb-name" style="display:none"></span>
    </div>
    <div class="actions">
      <button id="btn-newtab" onclick="openNewTab()" style="display:none">↗ 新标签页打开</button>
      <button onclick="reloadFrame()">↻ 刷新</button>
    </div>
  </div>

  <div class="main-iframe-wrap">
    <div id="empty" class="empty-state">
      <div class="emoji">📊</div>
      <div>从左侧选择一个看板开始</div>
      <div class="hint">所有看板均为静态页面，无需服务器</div>
    </div>
    <iframe id="frame" style="display:none"></iframe>
  </div>
</div>

<script>
// ── 加载 manifest ──
let MANIFEST = [];

fetch('manifest.json')
  .then(r => r.json())
  .then(data => {
    MANIFEST = data.dashboards || [];
    renderNav();
  })
  .catch(() => {
    document.getElementById('nav-list').innerHTML =
      '<div style="padding:12px 20px;color:#666;font-size:12px">manifest.json 加载失败</div>';
  });

// ── 渲染导航 ──
function renderNav() {
  const list = document.getElementById('nav-list');
  list.innerHTML = MANIFEST.map(d => `
    <div class="sidebar-item" onclick="loadDashboard('${d.id}')" id="nav-${d.id}">
      <div class="icon">${d.icon}</div>
      <div class="info">
        <div class="name">${d.name}</div>
        <div class="desc">${d.description}</div>
      </div>
      <div class="arrow">›</div>
    </div>
  `).join('');
}

// ── 加载看板 ──
let currentId = null;

function loadDashboard(id) {
  const dash = MANIFEST.find(d => d.id === id);
  if (!dash) return;

  // 更新导航高亮
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  document.getElementById('nav-' + id)?.classList.add('active');

  // 更新顶栏
  document.getElementById('breadcrumb-home').style.display = '';
  document.getElementById('breadcrumb-sep').style.display = '';
  document.getElementById('breadcrumb-name').style.display = '';
  document.getElementById('breadcrumb-name').textContent = dash.name;
  document.getElementById('btn-newtab').style.display = '';

  // 切换 iframe
  document.getElementById('empty').style.display = 'none';
  const frame = document.getElementById('frame');
  frame.style.display = 'block';
  frame.src = dash.file + '?embed';

  currentId = id;
}

// ── 刷新 ──
function reloadFrame() {
  const frame = document.getElementById('frame');
  if (frame.src) {
    frame.src = frame.src; // 重新加载（含 embed 参数）
  }
}

// ── 新标签打开 ──
function openNewTab() {
  if (!currentId) return;
  const dash = MANIFEST.find(d => d.id === currentId);
  if (dash) window.open(dash.file, '_blank');
}
</script>
</body>
</html>
